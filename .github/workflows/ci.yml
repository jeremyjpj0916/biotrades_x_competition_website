name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  direct-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/support/direct-mail.sh
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: biotrades
          POSTGRES_PASSWORD: biotrades
          POSTGRES_DB: biotrades
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biotrades -d biotrades"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://biotrades:biotrades@localhost:5432/biotrades
      BETTER_AUTH_SECRET: automated-verification-nonproduction-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: TEST_DATABASE_URL="$DATABASE_URL" npm test
      - run: npx playwright install --with-deps chromium
      - run: PLAYWRIGHT_DATABASE_URL="$DATABASE_URL" npm run test:e2e
      - run: npm run build
